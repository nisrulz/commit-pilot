name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: go vet ./...
      - run: go test -count=1 ./tests/ -coverpkg=./src/lib/
      - run: go build ./src/
      - run: sh -n scripts/live-test.sh
