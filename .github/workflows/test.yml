name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./tests/... -coverpkg=./src/lib/
      - run: go build -o commit-pilot ./src/
      - run: sh -n scripts/live-test.sh
      - name: Run live tests with mock provider
        run: |
          go build -o "$RUNNER_TEMP/mock-openai" ./scripts/mock-openai
          "$RUNNER_TEMP/mock-openai" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/v1/models >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/v1/models >/dev/null
          make test-live
